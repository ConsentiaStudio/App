<title>Agenda y calculadora · Consentía Studio</title>
<!-- Consentía Studio · agenda y calculadora (solo consulta), para el móvil y para el ordenador.
     Las agendas y las listas de precios están cifradas: esta página las descarga de GitHub y las descifra AQUÍ,
     en el navegador, con la contraseña que escribes. La contraseña no se envía a ningún sitio.
     La calculadora calcula con los precios de cada centro; no cobra ni guarda nada.
     En el aparato no se guarda nada: ni la contraseña ni sus claves (se escribe cada vez que se abre la página). -->
<style>
:root{--ink:#111113;--pink:#ff2b91;--muted:#77736c;--line:#e4e0d8;--bg:#f4f2ee;--good:#1d8a4a}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.35 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{background:var(--ink);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;position:sticky;top:0;z-index:5}
header .t{display:flex;align-items:center;justify-content:space-between;gap:8px}
header b{letter-spacing:.14em;font-size:13px;text-transform:uppercase}
header button{background:transparent;color:#fff;border:1px solid #444;border-radius:4px;padding:6px 10px;font:inherit;font-size:12px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-top:10px}
.tabs button{flex:none;background:#26262a;color:#ddd;border:0;border-radius:16px;padding:6px 12px;font:inherit;font-size:13px}
.tabs button.on{background:var(--pink);color:#fff}
.days{display:flex;align-items:center;gap:8px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:var(--hh,56px);z-index:4}
.days button{background:#fff;border:1px solid var(--line);border-radius:4px;min-width:40px;height:36px;font:inherit;font-size:16px}
.days .d{flex:1;text-align:center;font-weight:700}
.days .hoy{font-size:12px;min-width:auto;padding:0 10px}
main{padding:10px 12px 40px;max-width:720px;margin:0 auto}
.emp{background:#fff;border:1px solid var(--line);border-radius:6px;margin:10px 0;overflow:hidden}
.emp h3{margin:0;padding:9px 12px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.it{display:flex;gap:10px;padding:9px 12px;border-bottom:1px solid #f0ede7;border-left:4px solid var(--c,#999)}
.it:last-child{border-bottom:0}
.it .h{font:700 13px ui-monospace,Consolas,monospace;white-space:nowrap;min-width:92px}
.it .w b{display:block}.it .w small{color:var(--muted)}
.it.x{opacity:.5}.it.x b{text-decoration:line-through}
.tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:1px 5px;border-radius:3px;margin-left:4px;vertical-align:1px}
.tag.c{background:#e3f4e9;color:var(--good)}.tag.x{background:#eee;color:#555}.tag.n{background:#fde4ec;color:#a3164c}
.blk{background:repeating-linear-gradient(135deg,#111 0 7px,#2b2b2b 7px 14px);color:#fff;border-left-color:#000}
.blk .w b{text-transform:uppercase;letter-spacing:.1em}
.none{color:var(--muted);padding:10px 12px;font-size:13px}
.note{font-size:12px;color:var(--muted);text-align:center;margin:14px 0}
.warn{background:#fff4d6;border:1px solid #ecd18c;color:#5c3d00;border-radius:6px;padding:10px 12px;margin:10px 0;font-size:13px}
.bad{background:#fde4ec;border:1px solid #eeb3c4;color:#6d0a28;border-radius:6px;padding:10px 12px;margin:10px 0;font-size:13px}
/* La entrada: el nombre, la contraseña y el logotipo. No se desplaza (ni «rebota» en el móvil). */
html.lock,html.lock body{height:100%;overflow:hidden;overscroll-behavior:none}
html.lock body{position:fixed;top:0;left:0;right:0;bottom:0}
.login{max-width:360px;margin:0 auto;padding:17vh 24px 0;text-align:center}
.login h1{margin:0 0 26px;font-size:20px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;color:var(--ink)}
.login .logo{display:block;width:88px;height:88px;margin:30px auto 0}
.login p{color:var(--muted);font-size:14px;margin:0 0 16px}
.login input[type=password]{display:block;width:100%;font:inherit;font-size:17px;text-align:center;padding:14px;border:1px solid #d6d2ca;border-radius:14px;background:#fff;-webkit-appearance:none;appearance:none}
.login input[type=password]:focus{outline:0;border-color:var(--pink);box-shadow:0 0 0 3px rgba(255,43,145,.18)}
.login button{width:100%;margin-top:12px;background:var(--ink);color:#fff;border:0;border-radius:14px;padding:14px;font:inherit;font-size:16px;font-weight:600}
.login button[disabled]{opacity:.6}
.login .bad,.login .warn{text-align:left;margin-top:14px}
.status{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);margin:8px 0}
.status span{flex:1;min-width:0}
.status button{flex:none;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:4px;padding:5px 9px;font:inherit;font-size:12px;font-weight:700}
.status button.lnk,.warn button.lnk{border:0;background:none;padding:0;text-decoration:underline;font-weight:700;font:inherit;font-weight:700;color:inherit}
/* «Hay una versión más nueva de esta página»: barra dentro de la cabecera (siempre a la vista), con su botón. */
.upd{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap;background:#fff4d6;color:#5c3d00;border-top:1px solid #ecd18c;padding:9px 12px;font-size:13.5px;font-weight:700;line-height:1.35}
.upd span{flex:1 1 200px;min-width:0}
.upd small{flex:1 1 100%;font-weight:400;font-size:12px}
.upd button{flex:none;background:var(--ink);color:#fff;border:0;border-radius:6px;padding:9px 16px;font:inherit;font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
/* Vista en columnas, como la agenda del programa: una columna por trabajadora y las horas hacia abajo. */
main.wide{max-width:none;padding:0}
main.wide .warn,main.wide .bad{margin:8px 12px}
main.wide .status{margin:6px 12px}
.gw{overflow:auto;background:#fff;border-top:1px solid var(--line);overscroll-behavior:contain}
.g{display:grid;position:relative;min-width:100%}
.gc,.gh{position:sticky;top:0;background:#fff;border-bottom:2px solid var(--ink)}
.gc{left:0;z-index:8}
.gh{z-index:6;border-left:1px solid #e7e3dc;padding:7px 8px;min-height:48px;display:flex;gap:6px;align-items:flex-start;min-width:0}
.gh .dot{margin-top:3px}
.gh div{min-width:0}
.gh b{display:block;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gh small{display:block;font-size:10px;font-weight:700;color:var(--muted);line-height:1.25}
.gh small.cl{display:inline-block;background:#111;color:#fff;text-transform:uppercase;letter-spacing:.1em;font-weight:900;padding:1px 5px;margin-top:2px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gt{position:sticky;left:0;z-index:5;background:#faf9f6;border-right:1px solid var(--line)}
.gt span{position:absolute;right:5px;font:700 10px ui-monospace,Consolas,monospace;color:#8a867e;transform:translateY(-6px)}
.gcol{position:relative;border-left:1px solid #e7e3dc}
.gcol .ln{position:absolute;left:0;right:0;border-top:1px solid #f0ede7}
.gcol .ln.hr{border-top-color:#ddd9d1}
.gcol .off{position:absolute;left:0;right:0;background:repeating-linear-gradient(135deg,#f3f1ec 0 6px,#ebe8e1 6px 12px)}
.gcol .bk{position:absolute;left:2px;right:2px;background:repeating-linear-gradient(135deg,#111 0 7px,#2b2b2b 7px 14px);border:1px solid #000;color:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;z-index:2}
.gcol .bk span{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.1em;background:#111;padding:2px 6px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ap{position:absolute;border-left:4px solid var(--c,#ff2b91);background:linear-gradient(var(--bg,#ffe3f0),var(--bg,#ffe3f0)),#fff;padding:3px 5px 2px;font-size:11px;line-height:1.2;overflow:hidden;z-index:3;border-radius:2px;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.ap b{display:block;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ap .t{display:block;font:700 9.5px ui-monospace,Consolas,monospace;color:#56534e;white-space:nowrap;overflow:hidden}
.ap .s{display:block;color:#44423d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ap.done{background:repeating-linear-gradient(135deg,var(--bg) 0 8px,rgba(255,255,255,.55) 8px 16px),#fff}
.ap.done>*{opacity:.66}
.now{position:absolute;left:0;right:0;border-top:2px solid var(--pink);z-index:4;pointer-events:none}
.sheetBack{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(17,17,19,.45);z-index:20;display:flex;align-items:flex-end}
.sheet{background:#fff;width:100%;max-height:86vh;overflow:auto;border-radius:18px 18px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet::before{content:'';display:block;width:36px;height:5px;border-radius:3px;background:#d6d2ca;margin:0 auto 12px}
.sheet h2{margin:2px 0;font-size:19px}
@media (min-width:720px){.sheetBack{align-items:center;justify-content:center}.sheet{max-width:440px;border-radius:18px;padding-bottom:18px}.sheet::before{display:none}}
.sheet .h{font:700 13px ui-monospace,Consolas,monospace;color:#56534e}
.sheet p{margin:8px 0 0}
.sheet .who{color:var(--muted);font-size:13px}
.sheet .row{padding:9px 0;border-bottom:1px solid #f0ede7}
.sheet button{width:100%;margin-top:14px;background:var(--ink);color:#fff;border:0;border-radius:13px;padding:13px;font:inherit;font-size:16px;font-weight:600}
/* Agenda y calculadora en la misma pantalla: en el ordenador, una al lado de la otra; en el móvil, dos pestañas abajo. */
.split{display:block}
.split.m-calc .pA,.split.m-agenda .pC{display:none}
/* La barra de abajo, como el «control segmentado» de un iPhone: dos botones dentro de una pista redondeada, el
   elegido en blanco y con su icono en rosa, sobre una barra translúcida. --mh es lo que mide la barra (sin el margen
   de seguridad del móvil): lo usan también el hueco que se deja debajo del contenido y el total de la calculadora. */
:root{--mh:67px}
.modes{position:fixed;left:0;right:0;bottom:0;z-index:9;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:#f7f6f3;border-top:1px solid rgba(17,17,19,.12)}
@supports ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){.modes{background:rgba(247,246,243,.8);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}}
.modes .seg{display:flex;gap:2px;max-width:520px;margin:0 auto;padding:3px;border-radius:14px;background:rgba(118,118,128,.16)}
.modes button{position:relative;flex:1 1 0;min-width:0;height:44px;display:flex;align-items:center;justify-content:center;gap:7px;padding:0 8px;border:0;border-radius:11px;background:transparent;color:#5b5b61;font:inherit;font-size:15px;font-weight:600;letter-spacing:-.01em;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:transform .12s ease-out,color .15s}
.modes button svg{flex:none;width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.modes button svg .f{fill:currentColor;stroke:none}
.modes button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modes button.on{background:#fff;color:var(--ink);box-shadow:0 3px 8px rgba(17,17,19,.12),0 1px 1px rgba(17,17,19,.08)}
.modes button.on.go{animation:segOn .18s ease-out}
.modes button.on svg{color:var(--pink)}
.modes button:active{transform:scale(.97)}
.modes button:focus-visible{outline:2px solid var(--pink);outline-offset:1px}
/* Lo que lleva sumada la cuenta: una insignia en la esquina del botón (no le quita sitio al nombre). */
.modes small{position:absolute;top:-8px;right:-3px;font:700 12px/1 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap;color:#fff;background:var(--pink);border-radius:999px;padding:4px 8px;box-shadow:0 0 0 2px #f7f6f3}
.modes small:empty{display:none}
@keyframes segOn{from{transform:scale(.96);box-shadow:none}to{transform:none}}
@media (prefers-reduced-motion:reduce){.modes button,.modes button.on.go{animation:none;transition:none}}
body.has-modes .pA main:not(.wide),body.has-modes .pC{padding-bottom:calc(var(--mh) + 18px + env(safe-area-inset-bottom))}
/* La calculadora. Sin título: arriba, tres pestañas como un control segmentado; debajo, lo que se puede añadir; y la
   cuenta, en una barra abajo que se abre al tocarla (en el ordenador, siempre a la vista debajo de la lista).
   Los extras se eligen por su grupo (como las categorías de los servicios) y, si tienen foto, se ven en baldosas
   con la foto; al tocar uno sube su ficha, con la foto en grande y lo justo que hay que decir (nº de uñas…). */
.pC{background:var(--bg)}
.calc{display:flex;flex-direction:column;min-height:60vh}
.cTabs{order:0;display:flex;gap:2px;margin:12px 12px 0;padding:3px;border-radius:12px;background:rgba(118,118,128,.16)}
.cTabs button{flex:1 1 0;min-width:0;height:36px;border:0;border-radius:9px;background:transparent;color:#5b5b61;font:inherit;font-size:14px;font-weight:600;-webkit-tap-highlight-color:transparent}
.cTabs button.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(17,17,19,.12),0 1px 1px rgba(17,17,19,.06)}
.cBody{order:1;padding:12px 12px 16px}
.cSearch{display:block;width:100%;font:inherit;font-size:16px;padding:10px 12px;border:0;border-radius:11px;background:rgba(118,118,128,.14);margin-bottom:10px;-webkit-appearance:none;appearance:none}
.cSearch:focus{outline:2px solid var(--pink);background:#fff}
.cCats{display:flex;gap:6px;overflow-x:auto;margin:0 -12px;padding:0 12px 10px;scrollbar-width:none}
.cCats::-webkit-scrollbar{display:none}
.cCats button{flex:none;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 13px;font:inherit;font-size:13.5px;font-weight:600;color:#44423d;-webkit-tap-highlight-color:transparent}
.cCats button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.cCats button i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--pink);margin-left:6px;vertical-align:2px}
.cList{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 2px rgba(17,17,19,.05)}
.cItem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border:0;border-bottom:1px solid #f0ede7;padding:12px 14px;font:inherit;color:var(--ink);-webkit-tap-highlight-color:transparent}
.cItem:last-child{border-bottom:0}
.cItem b{flex:1;min-width:0;font-weight:600}
.cItem small{display:block;color:var(--muted);font-weight:400;font-size:12.5px;margin-top:1px}
.cItem .p{flex:none;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.cItem .p.x{color:var(--pink);font-size:13.5px;max-width:46%;white-space:normal;text-align:right}
.cItem:active,.xCard:active{background:#fff0f7}
.xGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.xCard{display:flex;flex-direction:column;text-align:left;background:#fff;border:0;border-radius:14px;overflow:hidden;padding:0;font:inherit;color:var(--ink);box-shadow:0 1px 2px rgba(17,17,19,.06);-webkit-tap-highlight-color:transparent}
.xCard .ph{display:block;width:100%;aspect-ratio:1/1;background:#efece6}
.xCard .ph img{display:block;width:100%;height:100%;object-fit:cover}
.xCard .ph.no{display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#ffe9f3,#f4f2ee);color:#e2a9c4;font:500 34px Didot,"Bodoni 72","Times New Roman",serif}
.xCard .tx{display:block;padding:9px 11px 11px}
.xCard b{display:block;font-size:14px;font-weight:600;line-height:1.25}
.xCard small{display:block;margin-top:3px;font-size:12.5px;font-weight:700;color:var(--pink)}
.cHint{font-size:12.5px;color:var(--muted);margin:10px 2px 0}
/* Ficha de un extra */
.sheet .xFoto{display:block;width:100%;max-height:38vh;object-fit:contain;border-radius:12px;background:#f4f2ee;margin-bottom:12px}
.sheet .xPrecio{color:var(--pink);font-weight:700;margin-top:2px}
.sheet .xAyuda{color:#44423d;font-size:13.5px;line-height:1.4}
.stp{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid #f0ede7}
.sheet .xAyuda+.stp,.sheet .xPrecio+.stp{margin-top:12px}
.stp>span{font-weight:600}
.stp>div{display:flex;align-items:center;background:rgba(118,118,128,.14);border-radius:11px}
.sheet .stp button{width:46px;height:40px;margin:0;padding:0;border:0;border-radius:11px;background:transparent;color:var(--ink);font:400 24px/1 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.sheet .stp button[disabled]{opacity:.3}
.stp output{min-width:64px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.stp input{width:128px;font:inherit;font-size:17px;font-weight:700;text-align:right;padding:9px 12px;border:1px solid #d6d2ca;border-radius:11px;background:#fff}
.stp input:focus{outline:0;border-color:var(--pink);box-shadow:0 0 0 3px rgba(255,43,145,.18)}
.xRes{margin-top:10px;padding:11px 12px;border-radius:12px;background:#f4f2ee;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.xRes.no{background:#fff4d6;color:#5c3d00;font-weight:600}
.xRes:empty{display:none}
.sheet button.calcBtn{background:var(--pink);margin-top:14px}
.sheet button.calcBtn+button{margin-top:8px;background:transparent;color:var(--ink)}
/* La cuenta */
.tkBack{display:none}
.cTicket{order:2;display:none;background:#fff}
.cTicket h4{margin:0 0 4px;font-size:17px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.cTicket h4 span{flex:1}
.cTicket h4 button{border:0;background:rgba(118,118,128,.14);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;font-weight:600;color:var(--ink)}
.cTicket h4 button.x{width:30px;height:30px;padding:0;font-size:18px;line-height:1}
.cTicket .cHint{margin:0 0 6px}
.cLine{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #f0ede7}
.cLine div{flex:1;min-width:0;font-weight:600}.cLine small{display:block;color:var(--muted);font-size:12.5px;font-weight:400}
.cLine .p{flex:none;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.cLine button{flex:none;border:0;background:rgba(118,118,128,.14);border-radius:50%;width:28px;height:28px;font:inherit;font-size:17px;line-height:1;color:#5b5b61}
.cDisc{padding:10px 0 2px}
.cDisc>span{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:#5b5b61;margin-bottom:6px}
.cDisc>span b{color:var(--good);font-variant-numeric:tabular-nums}
.cDisc div{display:flex;flex-wrap:wrap;gap:6px}
.cDisc button{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;font-weight:600;color:#44423d}
.cDisc button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.cTotal{order:3;position:fixed;left:12px;right:12px;bottom:calc(var(--mh) + 10px + env(safe-area-inset-bottom));z-index:8;width:auto;margin:0;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:54px;padding:10px 16px;border:0;border-radius:16px;background:var(--ink);color:#fff;font:inherit;text-align:left;box-shadow:0 8px 22px rgba(17,17,19,.22);-webkit-tap-highlight-color:transparent;transition:background .2s}
.cTotal span{display:flex;align-items:center;gap:8px;min-width:0;font-size:15px;font-weight:600}
.cTotal span i{font-style:normal;font-size:12.5px;font-weight:700;min-width:22px;text-align:center;background:var(--pink);border-radius:999px;padding:2px 7px}
.cTotal span small{font-size:13px;font-weight:400;color:#b9b6b0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cTotal span svg{flex:none;width:16px;height:16px;fill:none;stroke:#b9b6b0;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.calc.tk .cTotal span svg{transform:rotate(180deg)}
.cTotal b{flex:none;font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}
.cTotal.flash{background:var(--pink)}
@media (max-width:1039px){
  .cBody{padding-bottom:84px}
  .calc.tk .tkBack{display:block;position:fixed;top:0;left:0;right:0;bottom:0;z-index:6;background:rgba(17,17,19,.4)}
  .calc.tk .cTicket{display:block;position:fixed;left:0;right:0;bottom:0;z-index:7;max-height:74vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(var(--mh) + 84px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(17,17,19,.2)}
}
@media (min-width:1040px){
  .split{display:grid;grid-template-columns:minmax(0,1fr) 400px;align-items:start}
  .split.m-calc .pA,.split.m-agenda .pC{display:block}
  .modes{display:none}
  body.has-modes .pA main:not(.wide),body.has-modes .pC{padding-bottom:0}
  .pC{position:sticky;top:var(--hh,56px);height:calc(100vh - var(--hh,56px));overflow:hidden;border-left:1px solid var(--line)}
  .calc{height:100%;min-height:0}
  .cBody{flex:1 1 auto;overflow:auto;min-height:140px}
  .cCats{flex-wrap:wrap;overflow:visible;margin:0;padding:0 0 10px}
  .cTicket{display:block;flex:0 1 auto;max-height:42%;overflow:auto;border-top:1px solid var(--line);padding:12px 14px 6px}
  .cTicket h4 button.x{display:none}
  .cTotal{position:static;width:100%;border-radius:0;box-shadow:none;cursor:default}
  .cTotal span svg{display:none}
}
.other{display:flex;gap:6px;margin-top:8px}.other input{flex:1;font:inherit;padding:8px;border:1px solid #bdb9b1;border-radius:4px}.other button{border:0;background:var(--ink);color:#fff;border-radius:4px;padding:0 12px;font:inherit}
